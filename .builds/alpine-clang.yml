---
image: alpine/edge
packages:
  - clang
  - make
  - man-db
  - python3
  - linux-headers  # needed by liburing
  - liburing-dev
  - util-linux-dev  # needed for <uuid/uuid.h>
  - libuuid
  - libmd-dev  # for SHA1 and SHA2
  - libb2-dev  # for BLAKE2
  - blake3-dev
  - scdoc
  - m4
  - coreutils  # for b2sum
sources:
  - https://git.sr.ht/~maelkum/viuavm
environment:
  CC: clang
  CXX: clang++
  CXXSTD: c++2b
  CXXFLAGS_SANITISER:
  PROGRESS_INDICATORS: false  # do not pollute output in CI
tasks:
  - build-preset-debug: |
      cd viuavm/new
      make clean
      make PRESET=debug --jobs 2
  - install-preset-debug: |
      cd viuavm/new
      make prefix=ci-debug install
  - test-preset-debug: |
      cd viuavm/new
      make test_prefix=ci-debug test
      PATH=./ci-debug/bin:$PATH USE_TOOLCHAIN_SCRIPT=true make test_prefix=ci-debug test
  - build-preset-test: |
      cd viuavm/new
      make clean
      make PRESET=test --jobs 2
  - install-preset-test: |
      cd viuavm/new
      make prefix=ci-test install
  - test-preset-test: |
      cd viuavm/new
      make test_prefix=ci-test test
      PATH=./ci-test/bin:$PATH USE_TOOLCHAIN_SCRIPT=true make test_prefix=ci-test test
  - build-preset-release: |
      cd viuavm/new
      make clean
      make PRESET=release --jobs 2
  - install-preset-release: |
      cd viuavm/new
      make prefix=ci-release install
  - test-preset-release: |
      cd viuavm/new
      make test_prefix=ci-release test
      PATH=./ci-release/bin:$PATH USE_TOOLCHAIN_SCRIPT=true make test_prefix=ci-release test
      PATH=./ci-release/bin:$PATH viua help viua.1 >/dev/null
      PATH=./ci-release/bin:$PATH viua help asm.1 >/dev/null
      PATH=./ci-release/bin:$PATH viua help ld.1 >/dev/null
      PATH=./ci-release/bin:$PATH viua help dis.1 >/dev/null
      PATH=./ci-release/bin:$PATH viua help vm.1 >/dev/null
      PATH=./ci-release/bin:$PATH viua help asm.5 >/dev/null
  - build-io-classic: |
      cd viuavm/new
      make clean
      make PRESET=release io_impl=classic --jobs 2
  - test-io-classic: |
      cd viuavm/new
      make io_impl=classic test
